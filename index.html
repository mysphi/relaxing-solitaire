<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#4F6F5F">
<meta name="description" content="Relaxing Games: calm, ad-free solitaire and mines, with no timers.">
<title>Relaxing Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="menu.css">
<script>
  // Borrow light/dark and the table colour from the game played last, so the menu matches it.
  try {
    var last = localStorage.getItem('relaxing-games-last') === 'mines' ? 'relaxing-mines-look' : 'calm-solitaire-look';
    var look = JSON.parse(localStorage.getItem(last) || '{}');
    var a = look.appearance || 'auto', root = document.documentElement;
    if (a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) root.dataset.theme = 'dark';
    if (look.table) root.dataset.table = look.table;
  } catch (e) {}
</script>
</head>
<body>
<main class="hub">
  <header class="hub-head">
    <h1>Relaxing Games</h1>
  </header>

  <nav class="games" aria-label="Games">
    <a class="game" href="solitaire/">
      <img src="solitaire/game-icon.svg" alt="" width="72" height="72">
      <span class="game-text">
        <span class="game-name">Solitaire</span>
        <span class="game-status" id="solitaire-status" hidden></span>
      </span>
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="game" href="mines/">
      <img src="mines/game-icon.svg" alt="" width="72" height="72">
      <span class="game-text">
        <span class="game-name">Mines</span>
        <span class="game-status" id="mines-status" hidden></span>
      </span>
      <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <p class="version">Version 4</p>
</main>
<script src="menu.js"></script>
</body>
</html>
